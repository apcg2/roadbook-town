<dialog class="checklist-dialog" id="checklist-dialog" aria-labelledby="checklist-title">
  <div class="checklist-shell">
    <header class="checklist-head">
      <h2 id="checklist-title">出发前准备</h2>
      <button class="checklist-close" type="button" aria-label="关闭便利贴">×</button>
    </header>
    <ul class="checklist-list" id="checklist-list" aria-label="行前准备清单"></ul>
    <form class="checklist-form" id="checklist-form">
      <label for="checklist-input" class="pixel-defs">新增准备事项</label>
      <input class="checklist-input" id="checklist-input" name="item" type="text" maxlength="30" autocomplete="off" placeholder="添加准备事项">
      <button class="checklist-add" type="submit">添加</button>
    </form>
  </div>
</dialog>
